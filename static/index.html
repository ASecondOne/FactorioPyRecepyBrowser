<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pyanodons Planner</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icons/entity/distilator.png">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="tabs">
      <button data-tab="machines" class="active">Machines</button>
      <button data-tab="recipes">Recipes</button>
    </div>
    <input id="search" type="search" placeholder="Search machines…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="showVariants"> show legacy/TURD variants</label>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="toolbar">
      <span class="brand">Pyanodons Planner</span>
      <button id="btnNew" title="Clear the canvas">New</button>
      <button id="btnSave">Save</button>
      <button id="btnLoad">Load</button>
      <button id="btnExport" title="Download layout JSON">Export</button>
      <button id="btnImport" title="Import layout JSON">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <span class="sep"></span>
      <button id="btnSolve" class="primary">Auto-calc</button>
      <label class="chk"><input type="checkbox" id="autoSolve" checked> live</label>
      <label class="chk" title="Link rate labels (auto-hidden when zoomed far out)"><input type="checkbox" id="showLabels" checked> labels</label>
      <select id="unit"><option value="1">/s</option><option value="60">/min</option></select>
      <button id="btnFit" title="Fit view">Fit</button>
      <span id="layoutName"></span>
      <span id="status"></span>
    </div>
    <div id="viewport">
      <div id="world">
        <svg id="links"></svg>
        <div id="linkLabels"></div>
        <div id="nodes"></div>
      </div>
      <div id="hint">Drag a machine from the left onto the grid. Drag from an output port (right) to an input port (left) to connect. Set a target on a node, the rest is calculated.</div>
    </div>
    <div id="summary"></div>
  </main>
</div>
<div id="modal" class="hidden"><div class="modal-box"><div class="modal-head"><span id="modalTitle"></span><button id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<div id="tooltip" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
