[package]
name = "pyanodons-planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
microlp = "0.2"

[profile.release]
opt-level = 3
